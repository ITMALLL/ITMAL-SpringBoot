# H2 in-memory datasource for migration tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# MyBatis
mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.type-aliases-package=com.itmal
mybatis.configuration.map-underscore-to-camel-case=true

# Disable mail auto-configuration (no real mail server in tests)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration

# Disable thymeleaf cache
spring.thymeleaf.cache=false

# Suppress noisy logging in tests
logging.level.org.mybatis=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.flywaydb=INFO
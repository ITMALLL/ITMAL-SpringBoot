spring.application.name=itmal
app.base-url=${APP_BASE_URL:http://localhost:8080}

# datasource
spring.datasource.url=jdbc:mysql://localhost:3306/itmal_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# mybatis
mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.type-aliases-package=com.itmal
mybatis.configuration.map-underscore-to-camel-case=true

# thymeleaf
spring.thymeleaf.cache=false

# sql log
logging.level.org.mybatis=DEBUG

# server
server.servlet.session.timeout=30m

# security
app.remember-me.key=${REMEMBER_ME_KEY}

# OAuth2
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Papago API setting
papago.api.client-id=${PAPAGO_CLIENT_ID}
papago.api.client-secret=${PAPAGO_CLIENT_SECRET}
papago.api.url=https://papago.apigw.ntruss.com/nmt/v1/translation

# file upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=160MB

# file storage
file.upload-dir=./questionUploads/
spring.security.filter.order=5

# Gmail SMTP (credentials in application-local.properties)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#RememberMe
REMEMBER_ME_KEY=${REMEMBER_ME_KEY}

#OAuth Key
spring.security.oauth2.client.registration.github.client_id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client_secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.client_id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client_secret=${GOOGLE_CLIENT_SECRET}

#Spring mail
spring.mail.username=${MAIL.USERNAME}
spring.mail.password=${MAIL.PASSWORD}
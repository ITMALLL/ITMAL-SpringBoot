<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>잇말 - 질문 게시판</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Files -->
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/questions.css" />
  </head>
  <body>
  <div th:replace="~{fragments/header :: header}"></div>

  <main style="max-width: 1200px; margin: 0 auto; padding: 48px 24px">
      <!-- Page Header -->
      <div class="write-question-section">
        <div class="write-question-info">
          <h1 class="page-title">질문 게시판</h1>
          <p class="page-subtitle">
            언어 학습 중 궁금한 점을 자유롭게 질문하세요. 원어민과 튜터들이
            여러분의 학습을 도와드립니다.
          </p>
        </div>
        <a class="btn-write-question" th:href="@{/questions/write}">
          <span class="material-symbols-outlined">edit</span>
          질문 작성
        </a>
      </div>

      <!-- Search & Filter Section (GET form) -->
      <form method="get" th:action="@{/questions/list}" class="search-filter-section">
        <!-- 검색창 + 검색 + 정렬/필터 한 줄 -->
        <div class="search-container">
          <div class="search-input-group">
            <svg
              class="search-icon"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
            <input
              type="text"
              name="keyword"
              class="search-input"
              th:value="${search.keyword}"
              placeholder="궁금한 키워드를 입력하세요 (예: 문법, 표현...)"
            />
          </div>
          <button type="submit" class="filter-btn active">검색</button>

          <div class="filter-group">
            <span class="filter-label">정렬 기준</span>
            <select name="sort" class="sort-select" onchange="this.form.submit()">
              <option value="latest" th:selected="${search.sort == 'latest'}">최신순</option>
              <option value="views"  th:selected="${search.sort == 'views'}">조회수순</option>
              <!-- 추후: 답변 많은 순 / 좋아요 순 -->
            </select>
          </div>

          <div class="filter-group">
            <span class="filter-label">학습 언어</span>
            <select name="languageId" class="sort-select" onchange="this.form.submit()">
              <option value="">전체</option>
              <option th:each="l : ${languages}"
                      th:value="${l.languageId}"
                      th:text="${l.languageName}"
                      th:selected="${search.languageId != null and search.languageId == l.languageId}"></option>
            </select>
          </div>

          <div class="filter-group">
            <span class="filter-label">카테고리</span>
            <select name="category" class="sort-select" onchange="this.form.submit()">
              <option value="">전체</option>
              <option th:each="c : ${categories}"
                      th:value="${c.code}"
                      th:text="${c.label}"
                      th:selected="${search.category == c.code}"></option>
            </select>
          </div>

          <div class="filter-group">
            <span class="filter-label">질문 대상</span>
            <select name="target" class="sort-select" onchange="this.form.submit()">
              <option value="">전체</option>
              <option th:each="t : ${targets}"
                      th:value="${t.code}"
                      th:text="${t.label}"
                      th:selected="${search.target == t.code}"></option>
            </select>
          </div>
        </div>
      </form>

      <!-- Questions Grid -->
      <div class="questions-grid">

        <!-- 질문이 하나도 없을 때 -->
        <p th:if="${#lists.isEmpty(questions)}"
           style="grid-column: 1 / -1; text-align: center; color: var(--on-surface-variant); padding: 48px 0;">
          아직 등록된 질문이 없습니다.
        </p>

        <!-- 질문 목록 반복 (실제 DB 데이터) -->
        <a th:each="q : ${questions}"
           th:href="@{'/questions/' + ${q.questionId}}"
           class="question-list-card"
           th:classappend="${q.status == 'ADOPTED'} ? ' resolved' : ''">
          <div class="card-content">
            <div class="card-tags">
              <!-- 대상 뱃지: 대상별 색상 (tutor=연노랑 / community=연두) -->
              <span th:if="${q.target != null and q.target != ''}"
                    class="card-tag"
                    th:classappend="'tag-target-' + ${q.target}"
                    th:text="${T(com.itmal.question.dto.Target).labelOf(q.target)}">대상</span>
              <!-- 언어 (DB 값) -->
              <span class="card-tag tag-language" th:text="${q.languageName}">언어</span>
              <!-- 카테고리: 코드 → 한글 (Category enum 단일 소스) -->
              <span class="card-tag tag-category"
                    th:text="${T(com.itmal.question.dto.Category).labelOf(q.category)}">카테고리</span>
            </div>
            <h3 class="card-title" th:text="${q.title}">제목</h3>
            <div class="card-meta">
              <div class="meta-author">
                <span th:text="${q.nickname}">작성자</span>
              </div>
              <div class="meta-separator"></div>
              <div class="meta-stat">
                <span class="material-symbols-outlined" style="font-size: 18px">visibility</span>
                <span th:text="${q.viewCount}">0</span>
              </div>
              <div class="meta-stat">
                <span class="material-symbols-outlined" style="font-size: 18px">calendar_today</span>
                <span th:text="${#temporals.format(q.createdAt, 'yyyy.MM.dd')}">2024.01.01</span>
              </div>
            </div>
          </div>
          <div class="card-side">
            <!-- 답변 상태 -->
            <span class="card-tag tag-status"
                  th:classappend="${q.status == 'ADOPTED'} ? ' status-adopted' : (${q.status == 'ANSWERED'} ? ' status-answered' : ' status-waiting')"
                  th:switch="${q.status}">
              <span th:case="'ADOPTED'">해결 완료</span>
              <span th:case="'ANSWERED'">채택 중</span>
              <span th:case="*">답변 대기 중</span>
            </span>
            <div class="card-chevron">
              <span class="material-symbols-outlined">chevron_right</span>
            </div>
          </div>
        </a>
      </div>

      <!-- Pagination -->
      <div class="pagination" th:if="${totalPages > 0}">
        <!-- 이전 페이지: 첫 페이지에서는 링크 없이 비활성 span 으로 렌더 -->
        <a th:if="${currentPage > 1}"
           class="pagination-btn"
           th:href="@{/questions/list(page=${currentPage - 1}, size=${search.size},
                     keyword=${search.keyword}, languageId=${search.languageId},
                     category=${search.category}, target=${search.target}, sort=${search.sort})}">
          <span class="material-symbols-outlined">chevron_left</span>
        </a>
        <span th:unless="${currentPage > 1}" class="pagination-btn disabled">
          <span class="material-symbols-outlined">chevron_left</span>
        </span>

        <!-- 첫 페이지 + 생략 표시 (윈도우가 1보다 뒤에서 시작할 때만) -->
        <a th:if="${startPage > 1}"
           class="pagination-btn"
           th:text="1"
           th:href="@{/questions/list(page=1, size=${search.size},
                     keyword=${search.keyword}, languageId=${search.languageId},
                     category=${search.category}, target=${search.target}, sort=${search.sort})}">1</a>
        <span th:if="${startPage > 2}" class="pagination-ellipsis">…</span>

        <!-- 페이지 번호 (윈도우: startPage ~ endPage) -->
        <a th:each="p : ${#numbers.sequence(startPage, endPage)}"
           class="pagination-btn"
           th:classappend="${p == currentPage} ? ' active' : ''"
           th:text="${p}"
           th:href="@{/questions/list(page=${p}, size=${search.size},
                     keyword=${search.keyword}, languageId=${search.languageId},
                     category=${search.category}, target=${search.target}, sort=${search.sort})}">1</a>

        <!-- 생략 표시 + 마지막 페이지 (윈도우가 끝보다 앞에서 끝날 때만) -->
        <span th:if="${endPage < totalPages - 1}" class="pagination-ellipsis">…</span>
        <a th:if="${endPage < totalPages}"
           class="pagination-btn"
           th:text="${totalPages}"
           th:href="@{/questions/list(page=${totalPages}, size=${search.size},
                     keyword=${search.keyword}, languageId=${search.languageId},
                     category=${search.category}, target=${search.target}, sort=${search.sort})}">N</a>

        <!-- 다음 페이지: 마지막 페이지에서는 링크 없이 비활성 span 으로 렌더 -->
        <a th:if="${currentPage < totalPages}"
           class="pagination-btn"
           th:href="@{/questions/list(page=${currentPage + 1}, size=${search.size},
                     keyword=${search.keyword}, languageId=${search.languageId},
                     category=${search.category}, target=${search.target}, sort=${search.sort})}">
          <span class="material-symbols-outlined">chevron_right</span>
        </a>
        <span th:unless="${currentPage < totalPages}" class="pagination-btn disabled">
          <span class="material-symbols-outlined">chevron_right</span>
        </span>
      </div>
    </main>
  <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>

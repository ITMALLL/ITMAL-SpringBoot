<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--csrf 헤더로 보냄-->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <title>잇말 - 질문 수정</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/questions-write.css" />

    <!-- 0625 ckeditor cdn 추가-->
    <script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>

  </head>
  <body>
  <div th:replace="~{fragments/header :: header}"></div>

  <!-- Main Content -->
    <main class="write-main">
      <div class="write-container">
        <!-- Header Section -->
        <div class="write-header">
          <h1 class="write-title">질문 수정</h1>
          <p class="write-description">
            작성한 질문의 내용을 수정할 수 있어요.
          </p>
        </div>

        <!-- Form Container -->
        <form
                class="write-form"
                id="question-form"
                th:action="@{/questions/{id}/edit(id=${question.questionId})}"
                method="post"
                enctype="multipart/form-data"
        >
          <!-- Select Fields Grid -->
          <div class="form-select-grid">
            <!-- Language Select -->
            <div class="form-field">
              <label class="form-label required">언어 선택</label>
              <select class="form-select" name="languageId" required>
                <option value="">언어를 선택하세요</option>
                <option th:each="lang : ${languages}"
                        th:value="${lang.languageId}"
                        th:text="${lang.languageName}"
                        th:selected="${lang.languageId == question.languageId}">
                </option>
              </select>
            </div>

            <!-- Category Select -->
            <div class="form-field">
              <label class="form-label required">카테고리</label>
              <select class="form-select" name="category" required>
                <option value="">카테고리를 선택하세요</option>
                <option th:each="c : ${categories}"
                        th:value="${c.code}"
                        th:text="${c.label}"
                        th:selected="${question.category == c.code}"></option>
              </select>
            </div>

            <!-- Target Select -->
            <div class="form-field">
              <label class="form-label required">질문 대상</label>
              <select class="form-select" name="target" required>
                <option value="">대상을 선택하세요</option>
                <option th:each="t : ${targets}"
                        th:value="${t.code}"
                        th:text="${t.label}"
                        th:selected="${question.target == t.code}"></option>
              </select>
            </div>
          </div>

          <!-- Title Field -->
          <div class="form-field full-width">
            <label class="form-label required">제목</label>
            <input
              type="text"
              name="title"
              class="form-input"
              placeholder="제목을 입력해주세요"
              maxlength="200"
              th:value="${question.title}"
              required
            />
          </div>

          <!-- Description Field -->
          <div class="form-field full-width">
            <label class="form-label required">설명</label>
            <textarea
              class="form-textarea"
              name="content"
              id="editor"
              placeholder="궁금한 내용을 자세히 설명해주세요. 상황이나 문맥을 함께 적어주시면 원어민에게 큰 도움이 될 거예요."
              maxlength="5000"
              th:text="${question.content}"
            ></textarea>
            <div class="char-counter">
              <span id="char-count">0</span> / 5,000자
            </div>
          </div>

          <!-- File Attachment Section -->
          <div class="form-field full-width">
            <label class="form-label">파일 첨부</label>

            <!-- 기존 첨부파일: × 로 연결 끊기 -->
            <ul class="attachment-file-list" id="existing-file-list">
              <li th:each="att : ${attachments}"
                  class="attachment-file-item"
                  th:attr="data-id=${att.id}">
                <span class="material-symbols-outlined attachment-file-icon"
                      th:text="${att.fileType != null and #strings.startsWith(att.fileType, 'audio/')} ? 'mic' : 'description'">description</span>
                <span class="attachment-file-name" th:text="${att.originalName}">파일명</span>
                <span class="attachment-file-size" th:if="${att.fileSize != null}"
                      th:text="${att.fileSize < 1048576}
                               ? ${#numbers.formatDecimal(att.fileSize / 1024.0, 1, 1)} + 'KB'
                               : ${#numbers.formatDecimal(att.fileSize / 1048576.0, 1, 1)} + 'MB'">1.2MB</span>
                <button type="button" class="attachment-file-remove">
                  <span class="material-symbols-outlined">close</span>
                </button>
              </li>
            </ul>

            <!-- 새 파일 추가 -->
            <div class="attachment-area">
              <label class="attachment-btn" for="file-input">
                <span class="material-symbols-outlined">attach_file</span>
                파일 선택
              </label>
              <input
                type="file"
                id="file-input"
                name="files"
                multiple
                accept=".mp3,.m4a,.wav,.ogg,.aac,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip"
                style="display: none;"
              />
              <span class="attachment-limit">최대 3개 · 파일당 50MB 이하</span>
            </div>
            <p class="attachment-hint">음성: mp3, m4a, wav, ogg, aac &nbsp;·&nbsp; 문서: pdf, doc, docx, ppt, pptx, xls, xlsx, txt, zip</p>

            <ul class="attachment-file-list" id="file-list"></ul>
          </div>

          <!-- Form Actions -->
          <div class="form-actions">
            <button type="button" class="btn btn-outline">취소</button>
            <button type="submit" class="btn btn-primary">수정 완료</button>
          </div>
        </form>
      </div>
    </main>

  <div th:replace="~{fragments/footer :: footer}"></div>


  <script>
      // 취소 버튼 (변경 사항이 있어도 안전하게 뒤로가기 확인)
      document.querySelector(".btn-outline").addEventListener("click", () => {
        if (confirm("수정을 취소하시겠어요? 변경한 내용은 저장되지 않아요.")) {
          history.back();
        }
      });
    </script>

    <script>
      // ===== 첨부파일: 기존 파일 제거 + 신규 파일 추가 (총합 최대 3개) =====
      const MAX_FILES = 3;
      const MAX_SIZE = 50 * 1024 * 1024;
      // 서버 ALLOWED_EXTENSIONS 와 동일하게 유지할 것
      const ALLOWED_EXTS = ['mp3','m4a','wav','ogg','aac','pdf','doc','docx','ppt','pptx','xls','xlsx','txt','zip'];
      function extOf(name) {
        const dot = name.lastIndexOf('.');
        return dot >= 0 ? name.slice(dot + 1).toLowerCase() : '';
      }

      const existingListEl = document.getElementById('existing-file-list');
      const fileInput = document.getElementById('file-input');
      const fileListEl = document.getElementById('file-list');

      let selectedFiles = [];   // 새로 추가한 파일
      let deletedIds = [];      // 연결 끊을 기존 첨부 id

      // 화면에 남아있는 기존 첨부 수
      function remainingExistingCount() {
        return existingListEl.querySelectorAll('.attachment-file-item').length;
      }
      function totalCount() {
        return remainingExistingCount() + selectedFiles.length;
      }

      // 기존 파일 × 클릭 → 목록에서 빼고 삭제 id 수집
      existingListEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.attachment-file-remove');
        if (!btn) return;
        const li = btn.closest('.attachment-file-item');
        const id = li.dataset.id;
        if (id) deletedIds.push(id);
        li.remove();
      });

      // 새 파일 선택
      fileInput.addEventListener('change', () => {
        const newFiles = Array.from(fileInput.files);
        for (const file of newFiles) {
          if (totalCount() >= MAX_FILES) {
            alert('파일은 최대 3개까지 첨부할 수 있습니다.');
            break;
          }
          if (!ALLOWED_EXTS.includes(extOf(file.name))) {
            alert(`${file.name}: 지원하지 않는 파일 형식입니다.`);
            continue;
          }
          if (file.size > MAX_SIZE) {
            alert(`${file.name}: 파일 크기가 50MB를 초과합니다.`);
            continue;
          }
          selectedFiles.push(file);
        }
        fileInput.value = '';
        renderFileList();
      });

      function renderFileList() {
        fileListEl.innerHTML = '';
        selectedFiles.forEach((file, index) => {
          const isAudio = file.type.startsWith('audio/');
          const sizeText = file.size < 1024 * 1024
            ? (file.size / 1024).toFixed(1) + 'KB'
            : (file.size / 1024 / 1024).toFixed(1) + 'MB';
          const li = document.createElement('li');
          li.className = 'attachment-file-item';
          li.innerHTML = `
            <span class="material-symbols-outlined attachment-file-icon">${isAudio ? 'mic' : 'description'}</span>
            <span class="attachment-file-name"></span>
            <span class="attachment-file-size">${sizeText}</span>
            <button type="button" class="attachment-file-remove" data-index="${index}">
              <span class="material-symbols-outlined">close</span>
            </button>`;
          li.querySelector('.attachment-file-name').textContent = file.name;
          fileListEl.appendChild(li);
        });
      }

      // 새로 추가한 파일 × 클릭 → 목록에서 제거
      fileListEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.attachment-file-remove');
        if (!btn) return;
        selectedFiles.splice(parseInt(btn.dataset.index), 1);
        renderFileList();
      });
    </script>

    <script>
      document.getElementById('question-form').addEventListener('submit', async (e) => {
        e.preventDefault(); // 기본 전송을 막고 fetch로 직접 보냄

        // 1) 내용(CKEditor) 빈 값 검증 (에디터 초기화 실패 시 textarea 값으로 대체)
        const content = editorInstance ? editorInstance.getData() : document.getElementById('editor').value;
        const text = content.replace(/<[^>]*>/g, '').trim();
        if (!text) {
          alert('설명을 입력해주세요.');
          return;
        }

        // 2) 폼 필드 수집 + CKEditor 내용 / 첨부 변경 반영
        const form = e.target;
        const formData = new FormData(form);
        formData.set('content', content); // 숨은 textarea 대신 에디터 내용 사용
        formData.delete('files');                          // 비어있는 file input 제거
        selectedFiles.forEach(file => formData.append('files', file));           // 새로 추가한 파일
        deletedIds.forEach(id => formData.append('deleteAttachmentIds', id));    // 삭제할 기존 첨부 id

        // 3) CSRF 토큰을 헤더에 실어 전송
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        try {
          const res = await fetch(form.action, {
            method: 'POST',
            headers: { [csrfHeader]: csrfToken },
            body: formData
          });
          if (res.ok) {
            window.location.href = res.url;
          } else {
            const msg = await res.text();
            alert(msg || ('수정에 실패했습니다. (' + res.status + ')'));
          }
        } catch (err) {
          console.error(err);
          alert('네트워크 오류가 발생했습니다.');
        }
      });
    </script>

    <script>
      let editorInstance;
      ClassicEditor
              .create(document.querySelector('#editor'))
              .then(editor => {
                editorInstance = editor;

                // 기존 내용 기준으로 글자 수 초기 표시
                const initText = editor.getData()
                        .replace(/<[^>]*>/g, '')
                        .replace(/&nbsp;/g, '')
                        .replace(/&[a-z]+;/g, '')
                        .trim();
                document.getElementById('char-count').textContent = initText.length;

                editor.model.document.on('change:data', () => {
                  const text = editor.getData()
                          .replace(/<[^>]*>/g, '')     // HTML 태그 제거
                          .replace(/&nbsp;/g, '')      // &nbsp; 완전히 제거하긴 했는데.......카운트 안되는 게 맞을지 고민 후 (수정)
                          .replace(/&[a-z]+;/g, '')    // 기타 HTML 특수문자 제거
                          .trim();
                  const count = text.length;
                  document.getElementById('char-count').textContent = count;

                  if (count > 5000) {
                    // 5000자 초과시 마지막 입력 되돌리기
                    editor.execute('undo');
                    document.getElementById('char-count').textContent = 5000;
                  }
                });
              })
                .catch(error => { //에디터 에러 났을때 어떻게 처리할지 판단해서 (수정)
                console.error(error);
              });
    </script>
  </body>
</html>

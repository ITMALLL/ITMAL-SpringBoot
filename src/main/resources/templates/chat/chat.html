<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>잇말 - 1:1 채팅</title>

    <!-- Google Fonts -->
    <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
            rel="stylesheet"
    />
    <!-- Material Symbols -->
    <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
            rel="stylesheet"
    />

    <!-- CSS Files -->
    <link rel="stylesheet" href="/css/header.css"/>
    <link rel="stylesheet" href="/css/footer.css"/>
    <link rel="stylesheet" href="/css/common.css"/>
    <link rel="stylesheet" href="/css/chat.css"/>

    <!-- SockJS + STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>

<body class="chat-body">
<div th:replace="~{fragments/header :: header}"></div>

<!-- Main Chat Container -->
<main class="chat-container">
    <!-- Sidebar - Chat List -->
    <aside class="chat-sidebar">
        <div class="chat-list-header">
            <div class="chat-list-search">
                <label>
                    <input type="text" placeholder="대화방 검색..."/>
                </label>
            </div>
        </div>

        <div class="chat-list-tabs">
            <button class="chat-tab-btn active">모든 채팅</button>
            <button class="chat-tab-btn">안 읽은 채팅</button>
        </div>

        <!-- 채팅 목록 -->
        <div class="chat-section-header">
            채팅 목록
        </div>
        <div class="chat-list custom-scrollbar" id="chatList">
            <!-- 동적으로 생성됨 -->
        </div>
        <!-- 채팅 요청 함 -->
        <div class="chat-request-section">
            <div class="chat-section-header">
                요청함
            </div>
            <div id="chatRequestContainer" class="chat-request-container">
                <!-- 동적으로 생성됨 -->
            </div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <section class="chat-main" id="chatMain">
        <!-- Chat Header -->
        <header class="chat-header">
            <div class="chat-user-info">
                <div class="chat-user-avatar">
                    <img id="chatUserAvatar" src="https://ui-avatars.com/api/?name=채원&background=0D8ABC" alt="user"/>
                    <div class="chat-item-status-dot"></div>
                </div>
            </div>
            <div class="chat-actions">
                <div class="chat-divider"></div>
                <button class="btn-leave" id="leaveBtn" onclick="leaveRoom()">나가기</button>
            </div>
        </header>

        <!-- Messages Area -->
        <div class="messages-area custom-scrollbar" id="messageContainer">
            <!-- 동적으로 생성됨 -->
        </div>

        <!-- Message Input Area -->
        <div class="message-input-area">
            <div class="message-input-wrapper">
                <div class="input-container">
                    <textarea
                            class="message-input"
                            id="messageInput"
                            placeholder="메시지를 입력하세요..."
                            rows="1"
                    ></textarea>
                    <div class="input-actions">
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                            <span class="material-symbols-outlined">send</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 채팅방 선택 전 화면 -->
    <section class="chat-main chat-main-empty" id="noChat">
        <p>채팅방을 선택하세요</p>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<!-- JavaScript -->
<script src="/js/chat.js">

</script>
</body>
</html>

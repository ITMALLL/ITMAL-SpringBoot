<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>잇말 - 원어민 언어 질문 커뮤니티</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/header.css" />
  <link rel="stylesheet" href="/css/footer.css" />

  <!-- Common CSS Variables -->
  <link rel="stylesheet" href="/css/common.css" />

  <!-- Index CSS -->
  <link rel="stylesheet" href="/css/index.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Plus Jakarta Sans", sans-serif;
      background-color: var(--background);
      color: var(--on-surface);
    }

    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: "Plus Jakarta Sans", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }
  </style>
</head>
<body>
<!-- Header Fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<main>
  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1 class="hero-title">궁금한 표현, 원어민한테 바로 물어봐요</h1>
      <p class="hero-subtitle">영어, 일본어, 중국어 — 모국어 화자가 직접 답해드려요</p>
      <div class="hero-buttons">
        <button class="btn-hero-primary" onclick="location.href='/questions/write'">
          <span class="material-symbols-outlined">edit</span>
          질문하러 가기
        </button>
        <button class="btn-hero-secondary" onclick="location.href='/questions/list'">질문 둘러보기</button>
      </div>
    </div>
  </section>

  <!-- Stats Section -->
  <section class="stats">
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-number" th:text="${#numbers.formatInteger(questionCount, 1, 'COMMA')}">0</div>
        <div class="stat-label">등록된 질문</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" th:text="${#numbers.formatInteger(answerCount, 1, 'COMMA')}">0</div>
        <div class="stat-label">답변 수</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" th:text="${#numbers.formatInteger(activeUserCount, 1, 'COMMA')}">0</div>
        <div class="stat-label">활성 유저</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" th:text="${#numbers.formatInteger(languageCount, 1, 'COMMA')}">0</div>
        <div class="stat-label">지원 언어</div>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Questions Section -->
    <div class="questions-section">
      <div class="section-header">
        <h2 class="section-title">최근 질문</h2>
        <a th:href="@{/questions/list}" class="section-link">
          전체보기
          <span class="material-symbols-outlined">arrow_forward</span>
        </a>
      </div>

      <div class="questions-list">
        <!-- 최근 질문(최신순). 없으면 안내 문구 -->
        <p th:if="${#lists.isEmpty(recentQuestions)}"
           style="font-size:14px;color:var(--on-surface-variant);padding:16px 0;">
          아직 등록된 질문이 없습니다.
        </p>

        <a th:each="q : ${recentQuestions}"
           th:href="@{'/questions/' + ${q.questionId}}"
           class="question-card"
           style="display:block;">
          <div class="question-tags">
            <span class="question-tag tag-language" th:text="${q.languageName}">언어</span>
            <span class="question-tag tag-category"
                  th:text="${T(com.itmal.question.dto.Category).labelOf(q.category)}">카테고리</span>
          </div>
          <h3 class="question-title" th:text="${q.title}">제목</h3>
          <p class="question-content" th:text="${q.content}">본문 미리보기</p>
          <div class="question-meta">
            <div class="meta-author">
              <div class="author-avatar">
                <span class="material-symbols-outlined">person</span>
              </div>
              <div class="author-info">
                <span class="author-name" th:text="${q.nickname}">작성자</span>
                <span class="author-time" th:text="${#temporals.format(q.createdAt, 'yyyy.MM.dd')}">2024.01.01</span>
              </div>
            </div>
            <div class="meta-stats">
              <div class="stat-badge">
                <span class="material-symbols-outlined">chat_bubble</span>
                <span th:text="${q.answerCount}">0</span>
              </div>
              <div class="stat-badge">
                <span class="material-symbols-outlined">visibility</span>
                <span th:text="${q.viewCount}">0</span>
              </div>
            </div>
          </div>
        </a>
      </div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
      <!-- Language Stats Card -->
      <div class="stats-card">
        <h3 class="stats-card-title">언어별 질문 현황</h3>

        <div class="language-stat" th:each="lang : ${languageStats}">
          <div class="language-header">
            <span class="language-name">
              <span th:switch="${lang.languageCode}">
                <span th:case="'en'">🇺🇸</span>
                <span th:case="'ja'">🇯🇵</span>
                <span th:case="'zh-CN'">🇨🇳</span>
                <span th:case="'fr'">🇫🇷</span>
                <span th:case="'es'">🇪🇸</span>
                <span th:case="'de'">🇩🇪</span>
                <span th:case="'ko'">🇰🇷</span>
                <span th:case="*">🌐</span>
              </span>
              <span th:text="${lang.languageName}">언어</span>
            </span>
            <span class="language-count" th:text="${lang.questionCount}">0</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" th:style="'width: ' + ${lang.percent} + '%'"></div>
          </div>
        </div>
      </div>

      <!-- Online Users Card -->
      <div class="users-card">
        <h3 class="users-card-title">지금 채팅 중인 유저</h3>
        <div id="chatUserList"><p style="font-size:13px;color:var(--on-surface-variant);padding:8px 0;">채팅 중인 유저가 없습니다.</p></div>
      </div>
    </aside>
  </div>
</main>

<!-- Footer Fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
  async function loadChatUsers() {
    try {
      const res = await fetch('/api/chat-room/list');
      if (!res.ok) return;
      const rooms = await res.json();
      if (!Array.isArray(rooms) || rooms.length === 0) return;

      const container = document.getElementById('chatUserList');
      container.innerHTML = '';

      for (const room of rooms) {
        const nicknameRes = await fetch(`/api/users/${room.otherUserId}`);
        const nicknameJson = await nicknameRes.json();
        const nickname = nicknameJson.data?.nickname || `사용자 ${room.otherUserId}`;
        const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(nickname)}&length=1&background=random`;

        const item = document.createElement('div');
        item.className = 'user-item';

        const userInfo = document.createElement('div');
        userInfo.className = 'user-info';

        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'user-avatar';
        const img = document.createElement('img');
        img.src = avatarUrl;
        img.alt = nickname;
        avatarDiv.appendChild(img);

        const detailsDiv = document.createElement('div');
        detailsDiv.className = 'user-details';
        const nameDiv = document.createElement('div');
        nameDiv.className = 'user-name';
        nameDiv.textContent = nickname;
        detailsDiv.appendChild(nameDiv);

        userInfo.appendChild(avatarDiv);
        userInfo.appendChild(detailsDiv);

        const btn = document.createElement('button');
        btn.className = 'btn-chat';
        btn.textContent = '채팅 보기';
        btn.addEventListener('click', () => { location.href = `/chat?roomId=${room.id}`; });

        item.appendChild(userInfo);
        item.appendChild(btn);
        container.appendChild(item);
      }
    } catch (e) {
      // 비로그인 상태면 그냥 기본 문구 유지
    }
  }

  document.addEventListener('DOMContentLoaded', loadChatUsers);

  // Scroll effect for header
  window.addEventListener("scroll", () => {
    const topbar = document.querySelector("header");
    if (window.scrollY > 20) {
      topbar.style.boxShadow = "0 4px 12px rgba(0, 0, 0, 0.1)";
    } else {
      topbar.style.boxShadow = "0 1px 2px rgba(0, 0, 0, 0.05)";
    }
  });
</script>
</body>
</html>

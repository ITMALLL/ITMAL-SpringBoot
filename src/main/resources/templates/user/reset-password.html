<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>잇말 - 비밀번호 재설정</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body class="login-body">
    <div class="login-container">
      <div class="login-card">
        <div class="login-welcome">
          <h2 class="login-title">새 비밀번호 설정</h2>
          <p class="login-subtitle">사용할 새 비밀번호를 입력해주세요</p>
        </div>

        <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>

        <form class="login-form" th:action="@{/forgot-password/reset}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="token" th:value="${token}"/>

          <div class="form-group">
            <label for="newPassword" class="form-label">새 비밀번호 <span class="required">*</span></label>
            <div class="input-wrapper">
              <input type="password" id="newPassword" name="newPassword" class="form-input"
                     placeholder="새 비밀번호 입력" required/>
              <button type="button" class="input-icon-btn toggle-password" title="비밀번호 표시/숨김">
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">비밀번호 확인 <span class="required">*</span></label>
            <div class="input-wrapper">
              <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                     placeholder="비밀번호 다시 입력" required/>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-login">비밀번호 변경</button>
        </form>

        <div class="login-footer">
          <p><a href="/login" class="signup-link">로그인으로 돌아가기</a></p>
        </div>
      </div>
    </div>

    <script>
      document.querySelector(".toggle-password").addEventListener("click", (e) => {
        e.preventDefault();
        const input = document.getElementById("newPassword");
        const icon = e.currentTarget.querySelector(".material-symbols-outlined");
        if (input.type === "password") {
          input.type = "text";
          icon.textContent = "visibility_off";
        } else {
          input.type = "password";
          icon.textContent = "visibility";
        }
      });
    </script>
  </body>
</html>

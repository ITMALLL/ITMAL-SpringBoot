<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITMAL - Notifications</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/notifications.css" />
  </head>
  <body>
  <div th:replace="~{fragments/header :: header}"></div>

  <!-- Main Content -->
    <main class="notifications-main">
      <div class="notifications-container">
        <!-- Notifications Content -->
        <section class="notifications-content">
          <div class="content-header">
            <h1 class="content-title">알림</h1>
            <button class="btn btn-outline btn-sm" onclick="markAllAsRead()">
              <span class="material-symbols-outlined">done_all</span>
              모두 읽음 표시
            </button>
          </div>

          <div class="notifications-list">
            <th:block th:if="${notifications == null or #lists.isEmpty(notifications)}">
              <p style="text-align:center; padding: 2rem; color: #888;">알림이 없습니다.</p>
            </th:block>

            <article th:each="n : ${notifications}"
                     th:class="${n.isRead} ? 'notification-item' : 'notification-item unread'"
                     th:data-id="${n.notificationId}">
              <div th:class="${n.targetType == 'COMMENT'} ? 'notification-avatar secondary' : 'notification-avatar'">
                <span class="material-symbols-outlined"
                      th:text="${n.targetType == 'COMMENT'} ? 'chat_bubble' : 'check_circle'"></span>
              </div>
              <div class="notification-content">
                <div class="notification-header">
                  <h3 class="notification-title" th:text="${n.message}"></h3>
                  <time class="notification-time"
                        th:text="${#temporals.format(n.createdAt, 'yyyy.MM.dd HH:mm')}"></time>
                </div>
                <p class="notification-question" th:text="${n.questionTitle}"></p>
                <p class="notification-comment"
                   th:if="${n.comment != null}"
                   th:text="${n.comment}"></p>
              </div>
              <button class="btn btn-text btn-sm" aria-label="읽음 처리">
                <span class="material-symbols-outlined">close</span>
              </button>
            </article>
          </div>
        </section>
      </div>
    </main>
  <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
      async function markAllAsRead() {
        await fetch('/api/notifications/read-all', { method: 'PUT' });
        document.querySelectorAll('.notification-item.unread').forEach(item => {
          item.classList.remove('unread');
        });
      }

      document.querySelectorAll('.notification-item').forEach((item) => {
        item.addEventListener('click', async (e) => {
          if (!e.target.closest('.btn') && item.classList.contains('unread')) {
            const id = item.dataset.id;
            await fetch(`/api/notifications/${id}/read`, { method: 'PUT' });
            item.classList.remove('unread');
          }
        });
      });
    </script>
  </body>
</html>

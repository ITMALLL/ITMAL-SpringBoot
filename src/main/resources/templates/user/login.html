<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>잇말 - 로그인</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body class="login-body">
    <!-- Login Container -->
    <div class="login-container">
      <!-- Logo Section -->
      <!-- <div class="login-header">
        <h1 class="login-logo">잇말</h1>
        <p class="login-tagline">ITMAL · 언어공학 커뮤니티</p>
      </div> -->

      <!-- Login Card -->
      <div class="login-card">
        <!-- Welcome Section -->
        <div class="login-welcome">
          <h2 class="login-title">반가워요</h2>
          <p class="login-subtitle">오늘도 언어 실력을 키워볼까요?</p>
        </div>

        <!-- Social Login -->
        <div class="login-socials">
          <button class="social-btn github">
            <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v 3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
              />
            </svg>
            GitHub로 계속하기
          </button>

          <button class="social-btn google">
            <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                fill="#FBBC05"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              />
            </svg>
            Google로 계속하기
          </button>
        </div>

        <!-- Divider -->
        <div class="login-divider">
          <span>또는 이메일로 로그인</span>
        </div>

        <!-- Login Form -->
        <form class="login-form" th:action="@{/login}" method="post">
          <!-- Email Field -->
          <div class="form-group">
            <label for="email" class="form-label"
              >이메일 <span class="required">*</span></label
            >
            <div class="input-wrapper">
              <input
                type="email"
                id="email"
                name="username"
                class="form-input"
                placeholder="example@email.com"
                required
              />
              <button
                type="button"
                class="input-icon-btn"
                title="이메일 자동 완성"
              >
                <span class="material-symbols-outlined">person</span>
              </button>
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="password" class="form-label"
              >비밀번호 <span class="required">*</span></label
            >
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="비밀번호 입력"
                required
              />
              <button
                type="button"
                class="input-icon-btn toggle-password"
                title="비밀번호 표시/숨김"
              >
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>
          </div>

          <!-- Remember & Forgot -->
          <div class="form-footer">
            <div class="checkbox-groups">
              <label class="checkbox-group">
                <input type="checkbox" id="save-email" />
                <span class="checkbox-label">아이디 저장</span>
              </label>
              <label class="checkbox-group">
                <input type="checkbox" id="remember" name="remember-me" />
                <span class="checkbox-label">로그인 상태 유지</span>
              </label>
            </div>
            <a href="#" class="forgot-link">비밀번호 찾기</a>
          </div>

          <!-- Login Button -->
          <button type="submit" class="btn btn-primary btn-login">
            로그인
          </button>
        </form>

        <!-- Sign Up Link -->
        <div class="login-footer">
          <p>계정이 없으신가요? <a href="/register" class="signup-link">회원가입</a></p>
        </div>
      </div>
    </div>

    <script>
      // Toggle password visibility
      document
        .querySelector(".toggle-password")
        .addEventListener("click", (e) => {
          e.preventDefault();
          const input = document.getElementById("password");
          const icon = e.currentTarget.querySelector(
            ".material-symbols-outlined",
          );

          if (input.type === "password") {
            input.type = "text";
            icon.textContent = "visibility_off";
          } else {
            input.type = "password";
            icon.textContent = "visibility";
          }
        });

      // 아이디 저장
      const emailInput = document.getElementById("email");
      const saveEmailCheckbox = document.getElementById("save-email");
      const savedEmail = localStorage.getItem("savedEmail");

      if (savedEmail) {
        emailInput.value = savedEmail;
        saveEmailCheckbox.checked = true;
      }

      document.querySelector(".login-form").addEventListener("submit", () => {
        if (saveEmailCheckbox.checked) {
          localStorage.setItem("savedEmail", emailInput.value);
        } else {
          localStorage.removeItem("savedEmail");
        }
      });

      document.querySelector(".github").addEventListener("click", () => {
        location.href = "/oauth2/authorization/github";
      });

      document.querySelector(".google").addEventListener("click", () => {
        location.href = "/oauth2/authorization/google";
      });
    </script>
  </body>
</html>

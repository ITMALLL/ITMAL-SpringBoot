<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>잇말 - 비밀번호 찾기</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body class="login-body">
    <div class="login-container">
      <div class="login-card">
        <div class="login-welcome">
          <h2 class="login-title">비밀번호 찾기</h2>
          <p class="login-subtitle">가입하신 이메일로 임시 비밀번호를 보내드려요</p>
        </div>

        <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>

        <form class="login-form" th:action="@{/forgot-password}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="form-group">
            <label for="email" class="form-label">이메일 <span class="required">*</span></label>
            <div class="input-wrapper">
              <input type="email" id="email" name="email" class="form-input" placeholder="가입한 이메일 입력" required/>
              <span class="material-symbols-outlined input-icon">mail</span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-login">임시 비밀번호 받기</button>
        </form>

        <div class="login-footer">
          <p><a href="/login" class="signup-link">로그인으로 돌아가기</a></p>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITMAL - 프로필 수정</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/mypage.css" />
    <link rel="stylesheet" href="/css/mypage-edit.css" />
  </head>
  <body>
  <div th:replace="~{fragments/header :: header}"></div>

  <main>
    <!-- 파란 헤더 -->
    <section class="profile-section">
      <div class="profile-container">
        <div class="profile-header">
          <div class="profile-avatar-large">
            <span class="material-symbols-outlined">person</span>
          </div>
          <div class="profile-info">
            <h1 class="profile-name">프로필 수정</h1>
            <p class="profile-email" th:text="${user.username}">이메일</p>
          </div>
        </div>
      </div>
    </section>

    <!-- 흰 카드 폼 -->
    <section class="edit-section">
      <div class="edit-card">

        <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>

        <form th:action="@{/mypage/edit}" th:object="${profileUpdateRequest}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="edit-form-group">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" th:field="*{nickname}" class="edit-input" placeholder="2~20자 닉네임"/>
            <span th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}" class="field-error"></span>
          </div>

          <div class="edit-form-group">
            <label for="nativeLanguage">모국어</label>
            <select id="nativeLanguage" th:field="*{nativeLanguage}" class="edit-input">
              <option value="">선택해주세요</option>
              <option value="ko">한국어</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="zh">中文</option>
              <option value="fr">Français</option>
              <option value="es">Español</option>
            </select>
            <span th:if="${#fields.hasErrors('nativeLanguage')}" th:errors="*{nativeLanguage}" class="field-error"></span>
          </div>

          <div class="edit-form-group">
            <label>학습 언어</label>
            <div class="lang-chip-group">
              <label th:each="lang : ${allLanguages}" class="lang-chip-label">
                <input type="checkbox"
                       name="learningLanguages"
                       th:value="${lang.languageName}"
                       th:checked="${#lists.contains(profileUpdateRequest.learningLanguages, lang.languageName)}"/>
                <span th:text="${lang.languageName}">언어</span>
              </label>
            </div>
          </div>

          <div class="edit-actions">
            <button type="submit" class="btn btn-primary">저장</button>
            <a href="/mypage" class="btn btn-outline">취소</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>

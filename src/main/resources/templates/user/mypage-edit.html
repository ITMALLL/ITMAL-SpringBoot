<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITMAL - 프로필 수정</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/mypage.css" />
  </head>
  <body>
  <div th:replace="~{fragments/header :: header}"></div>

  <main class="mypage-main">
    <section class="profile-section">
      <div class="profile-container">
        <div class="profile-header">
          <div class="profile-avatar-large">
            <span class="material-symbols-outlined">person</span>
          </div>
          <div class="profile-info">
            <h1 class="profile-name">프로필 수정</h1>
            <p class="profile-email" th:text="${user.username}">이메일</p>
          </div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/mypage/edit}" th:object="${profileUpdateRequest}" method="post" class="edit-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="form-group">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" th:field="*{nickname}" class="form-input" placeholder="닉네임을 입력하세요"/>
            <span th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}" class="field-error"></span>
          </div>

          <div class="form-group">
            <label for="nativeLanguage">모국어</label>
            <input type="text" id="nativeLanguage" th:field="*{nativeLanguage}" class="form-input" placeholder="예: 한국어"/>
            <span th:if="${#fields.hasErrors('nativeLanguage')}" th:errors="*{nativeLanguage}" class="field-error"></span>
          </div>

          <div class="form-actions">
            <a href="/mypage" class="btn btn-outline">취소</a>
            <button type="submit" class="btn btn-primary">저장</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>

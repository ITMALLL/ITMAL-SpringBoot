<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITMAL - 비밀번호 변경</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/mypage.css" />
  </head>
  <body>
  <div th:replace="~{fragments/header :: header}"></div>

  <main class="mypage-main">
    <section class="profile-section">
      <div class="profile-container">
        <div class="profile-header">
          <div class="profile-avatar-large">
            <span class="material-symbols-outlined">lock</span>
          </div>
          <div class="profile-info">
            <h1 class="profile-name">비밀번호 변경</h1>
            <p class="profile-email" th:text="${user.username}">이메일</p>
          </div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/mypage/password}" th:object="${passwordChangeRequest}" method="post" class="edit-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="form-group">
            <label for="currentPassword">현재 비밀번호</label>
            <input type="password" id="currentPassword" th:field="*{currentPassword}" class="form-input"/>
            <span th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="field-error"></span>
          </div>

          <div class="form-group">
            <label for="newPassword">새 비밀번호 <small>(8자 이상)</small></label>
            <input type="password" id="newPassword" th:field="*{newPassword}" class="form-input"/>
            <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="field-error"></span>
          </div>

          <div class="form-group">
            <label for="newPasswordConfirm">새 비밀번호 확인</label>
            <input type="password" id="newPasswordConfirm" th:field="*{newPasswordConfirm}" class="form-input"/>
            <span th:if="${#fields.hasErrors('newPasswordConfirm')}" th:errors="*{newPasswordConfirm}" class="field-error"></span>
          </div>

          <div class="form-actions">
            <a href="/mypage" class="btn btn-outline">취소</a>
            <button type="submit" class="btn btn-primary">변경</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>

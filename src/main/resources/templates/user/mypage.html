<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITMAL - 마이페이지</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/mypage.css" />
    <link rel="stylesheet" href="/css/mypage-edit.css" />
    <meta name="_csrf" th:content="${_csrf.token}"/>
  </head>
  <body>
  <div th:replace="~{fragments/header :: header}"></div>


  <!-- Main Content -->
    <main class="mypage-main">
      <!-- Profile Section -->
      <section class="profile-section">
        <div class="profile-container">
          <!-- Profile Header -->
          <div class="profile-header">
            <div class="profile-avatar-large" id="profile-avatar">
              <span th:text="${#strings.substring(user.nickname, 0, 1)}">닉</span>
            </div>
            <div class="profile-info">
              <h1 class="profile-name" th:text="${user.nickname}">닉네임</h1>
              <p class="profile-email" th:text="${user.email != null ? user.email : user.username}">이메일</p>
            </div>
            <div class="profile-actions" th:if="${isMyPage}">
              <button type="button" class="btn btn-outline" onclick="openEditModal()">프로필 수정</button>
              <a href="/mypage/password" class="btn btn-outline" th:if="${!user.isSocialUser()}">비밀번호 변경</a>
            </div>
            <div class="profile-actions" th:if="${!isMyPage}">
              <button type="button" class="btn btn-primary" onclick="requestChat()">1:1 채팅 신청</button>
            </div>
          </div>

          <div th:if="${successMessage}" class="success-message" th:text="${successMessage}"></div>

          <!-- Profile Stats -->
          <div class="profile-stats">
            <div class="stat-card">
              <div class="stat-label">제출한 질문</div>
              <div class="stat-value" id="stat-questions">-</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">작성한 답변</div>
              <div class="stat-value" id="stat-answers">-</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">작성한 댓글</div>
              <div class="stat-value" id="stat-comments">-</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Tab Navigation -->
      <section class="mypage-content">
        <div class="tabs-container">
          <div class="tabs-nav">
            <button class="tab-btn active" data-tab="questions">
              <span class="material-symbols-outlined">help</span>
              <span th:text="${isMyPage} ? '내 질문' : '질문'">내 질문</span>
            </button>
            <button class="tab-btn" data-tab="answers">
              <span class="material-symbols-outlined">check_circle</span>
              <span th:text="${isMyPage} ? '내 답변' : '답변'">내 답변</span>
            </button>
            <button class="tab-btn" data-tab="comments">
              <span class="material-symbols-outlined">chat_bubble</span>
              <span th:text="${isMyPage} ? '내 댓글' : '댓글'">내 댓글</span>
            </button>
          </div>

          <!-- Tab Content -->
          <div class="tabs-content">
            <div class="tab-pane active" id="questions">
              <div class="activity-list" id="questions-list"></div>
            </div>
            <div class="tab-pane" id="answers">
              <div class="activity-list" id="answers-list"></div>
            </div>
            <div class="tab-pane" id="comments">
              <div class="activity-list" id="comments-list"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

  <!-- 계정 설정 섹션 (내 페이지에서만 표시) -->
  <section th:if="${isMyPage}" class="account-section" style="max-width:900px;margin:0 auto 40px;padding:0 20px;">
    <form th:action="@{/mypage/delete}" method="post"
          onsubmit="return confirm('정말 탈퇴하시겠습니까? 이 작업은 되돌릴 수 없습니다.');">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn btn-danger">회원 탈퇴</button>
    </form>
  </section>

  <!-- 프로필 수정 모달 (내 페이지에서만 표시) -->
  <div th:if="${isMyPage}" id="editModal" class="modal-overlay" onclick="closeEditModalOutside(event)">
    <div class="modal-card">
      <div class="modal-header">
        <h3>프로필 수정</h3>
        <button type="button" class="modal-close" onclick="closeEditModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div th:if="${editError}" class="error-message" th:text="${editError}"></div>

      <form th:action="@{/mypage/edit}" th:object="${profileUpdateRequest}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="edit-form-group">
          <label for="nickname">닉네임</label>
          <input type="text" id="nickname" th:field="*{nickname}" class="edit-input" placeholder="2~20자 닉네임"/>
        </div>

        <div class="edit-form-group">
          <label for="nativeLanguage">모국어</label>
          <select id="nativeLanguage" th:field="*{nativeLanguage}" class="edit-input">
            <option value="">선택해주세요</option>
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="zh">中文</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
          </select>
        </div>

        <div class="edit-form-group">
          <label>학습 언어</label>
          <div class="lang-chip-group">
            <label th:each="lang : ${allLanguages}" class="lang-chip-label">
              <input type="checkbox"
                     name="learningLanguages"
                     th:value="${lang.languageName}"
                     th:checked="${#lists.contains(profileUpdateRequest.learningLanguages, lang.languageName)}"/>
              <span th:text="${lang.languageName}">언어</span>
            </label>
          </div>
        </div>

        <div class="edit-actions">
          <button type="submit" class="btn btn-primary">저장</button>
          <button type="button" class="btn btn-outline" onclick="closeEditModal()">취소</button>
        </div>
      </form>
    </div>
  </div>

  <div th:replace="~{fragments/footer :: footer}"></div>


  <script th:inline="javascript">
    function openEditModal() {
      document.getElementById('editModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
      document.body.style.overflow = '';
    }
    function closeEditModalOutside(e) {
      if (e.target === document.getElementById('editModal')) closeEditModal();
    }

    // 에러 시 모달 자동 오픈
    const openModal = /*[[${openEditModal}]]*/ false;
    if (openModal) openEditModal();
  </script>

  <script th:inline="javascript">
    // 닉네임 기반 아바타 색상
    const colors = ['#5C6BC0','#26A69A','#EF5350','#AB47BC','#FF7043','#29B6F6','#66BB6A','#FFA726'];
    const nickname = /*[[${user.nickname}]]*/ '';
    const color = colors[nickname.charCodeAt(0) % colors.length];
    document.getElementById('profile-avatar').style.backgroundColor = color;

    const profileUserId = /*[[${user.userId}]]*/ null;
    const isMyPage = /*[[${isMyPage}]]*/ true;
  </script>

  <script>
    function formatDate(dateStr) {
      if (!dateStr) return '';
      return new Date(dateStr).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function emptyState(message) {
      return `<p style="text-align:center; padding:2rem; color:#888;">${message}</p>`;
    }

    function renderQuestions(list) {
      const el = document.getElementById('questions-list');
      if (!list.length) { el.innerHTML = emptyState('작성한 질문이 없습니다.'); return; }
      el.innerHTML = list.map(q => `
        <article class="activity-item" onclick="location.href='/questions/${q.questionId}'" style="cursor:pointer;">
          <div class="activity-header">
            <h3 class="activity-title">${q.title}</h3>
            <div class="activity-status">
              ${q.languageName ? `<span class="badge badge-primary">${q.languageName}</span>` : ''}
            </div>
          </div>
          <p class="activity-preview">${q.content ? q.content.slice(0, 80) + (q.content.length > 80 ? '...' : '') : ''}</p>
          <div class="activity-meta">
            <span class="material-symbols-outlined">calendar_today</span>
            <span>${formatDate(q.createdAt)}</span>
            <span class="material-symbols-outlined">visibility</span>
            <span>${q.viewCount ?? 0}회 조회</span>
          </div>
        </article>
      `).join('');
    }

    function renderAnswers(list) {
      const el = document.getElementById('answers-list');
      if (!list.length) { el.innerHTML = emptyState('작성한 답변이 없습니다.'); return; }
      el.innerHTML = list.map(a => `
        <article class="activity-item" onclick="location.href='/questions/${a.questionId}'" style="cursor:pointer;">
          <div class="activity-header">
            <div class="activity-status">
              ${a.accepted ? '<span class="badge badge-success">채택됨</span>' : ''}
            </div>
          </div>
          <p class="activity-preview">${a.content ? a.content.slice(0, 80) + (a.content.length > 80 ? '...' : '') : ''}</p>
          <div class="activity-meta">
            <span class="material-symbols-outlined">calendar_today</span>
            <span>${formatDate(a.createdAt)}</span>
            <span class="material-symbols-outlined">thumb_up</span>
            <span>${a.likeCount ?? 0}</span>
          </div>
        </article>
      `).join('');
    }

    function renderComments(list) {
      const el = document.getElementById('comments-list');
      if (!list.length) { el.innerHTML = emptyState('작성한 댓글이 없습니다.'); return; }
      el.innerHTML = list.map(c => `
        <article class="activity-item">
          <p class="comment-preview-label">작성한 댓글</p>
          <p class="activity-preview">${c.content}</p>
          <div class="activity-meta">
            <span class="material-symbols-outlined">calendar_today</span>
            <span>${formatDate(c.createdAt)}</span>
          </div>
        </article>
      `).join('');
    }

    async function loadTab(tabName) {
      try {
        if (tabName === 'questions') {
          const url = isMyPage ? '/api/mypage/questions' : `/api/mypage/questions?userId=${profileUserId}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`questions API 오류: ${res.status}`);
          renderQuestions(await res.json());
        } else if (tabName === 'answers') {
          const url = isMyPage ? '/api/mypage/answers' : `/api/mypage/answers?userId=${profileUserId}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`answers API 오류: ${res.status}`);
          renderAnswers(await res.json());
        } else if (tabName === 'comments') {
          const url = isMyPage ? '/api/mypage/comment' : `/api/mypage/comment?userId=${profileUserId}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`comments API 오류: ${res.status}`);
          renderComments(await res.json());
        }
      } catch (e) {
        console.error(e);
      }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        const tabName = e.currentTarget.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        e.currentTarget.classList.add('active');
        document.getElementById(tabName).classList.add('active');
        loadTab(tabName);
      });
    });

    async function loadStats() {
      const suffix = isMyPage ? '' : `?userId=${profileUserId}`;
      async function fetchCount(endpoint) {
        try {
          const r = await fetch(`/api/mypage/${endpoint}${suffix}`);
          if (!r.ok) return '-';
          return await r.text();
        } catch (e) {
          return '-';
        }
      }
      const [q, a, c] = await Promise.all([
        fetchCount('countQuestions'),
        fetchCount('countAnswers'),
        fetchCount('countComments')
      ]);
      document.getElementById('stat-questions').textContent = q;
      document.getElementById('stat-answers').textContent = a;
      document.getElementById('stat-comments').textContent = c;
    }

    // 페이지 로드 시 질문 탭 + 갯수 자동 로드
    loadTab('questions');
    loadStats();

    async function requestChat() {
      const res = await fetch('/api/chat-request', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.content
        },
        body: JSON.stringify({
          responderId: profileUserId,
          introMessage: '안녕하세요!'
        })
      });
      if (res.ok) {
        alert('채팅 신청을 보냈습니다.');
      } else {
        alert('채팅 신청 실패: ' + await res.text());
      }
    }
  </script>
  </body>
</html>

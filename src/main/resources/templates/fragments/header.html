<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6" lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Header</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
</head>
<body>
<header th:fragment="header" class="bg-surface-container-lowest border-b border-outline-variant sticky top-0 z-50 shadow-sm">
  <div class="flex justify-between items-center h-16 px-6">

    <!-- Logo (왼쪽) -->
    <a th:href="@{/}" class="text-headline-lg font-bold text-primary" style="text-decoration: none;">잇말</a>

    <!-- Navigation + Actions (오른쪽) -->
    <div class="flex items-center gap-6">
      <!-- Navigation -->
      <nav class="hidden md:flex items-center gap-6">
        <a th:href="@{/questions/list}"
           th:class="${page == 'index'} ? 'text-primary font-bold border-b-2 border-primary pb-1' : 'text-on-surface-variant border-b-2 border-transparent pb-1 hover:text-primary'"
           class="text-label-md transition-colors">
          질문 목록
        </a>

        <a th:href="@{/questions/write}"
           th:class="${page == 'index'} ? 'text-primary font-bold border-b-2 border-primary pb-1' : 'text-on-surface-variant border-b-2 border-transparent pb-1 hover:text-primary'"
           class="text-label-md transition-colors">
          질문하기
        </a>

        <a th:href="@{/chat}"
           th:class="${page == 'chat'} ? 'text-primary font-bold border-b-2 border-primary pb-1' : 'text-on-surface-variant border-b-2 border-transparent pb-1 hover:text-primary'"
           class="text-label-md transition-colors">
          채팅
        </a>

        <a th:href="@{/mypage}"
           th:class="${page == 'mypage'} ? 'text-primary font-bold border-b-2 border-primary pb-1' : 'text-on-surface-variant border-b-2 border-transparent pb-1 hover:text-primary'"
           class="text-label-md transition-colors">
          마이페이지
        </a>

        <a th:href="@{/admin/reports}"
           sec:authorize="hasRole('ADMIN')"
           th:class="${page == 'admin'} ? 'text-primary font-bold border-b-2 border-primary pb-1' : 'text-on-surface-variant border-b-2 border-transparent pb-1 hover:text-primary'"
           class="text-label-md transition-colors">
          관리자페이지
        </a>
      </nav>

      <!-- Divider -->
      <div class="h-6 w-px bg-outline-variant"></div>

      <!-- Notification + Auth -->
      <div class="flex items-center gap-4">
        <!-- Notification -->
        <a th:href="@{/notifications}" class="relative p-2 hover:bg-primary-fixed rounded-lg text-on-surface-variant inline-flex" style="position:relative;">
          <span class="material-symbols-outlined">notifications</span>
          <span id="notification-badge"
                style="display:none; position:absolute; top:-6px; right:-6px; background:#ef4444; color:white; font-size:10px; font-weight:700; border-radius:9999px; min-width:16px; height:16px; padding:0 4px; align-items:center; justify-content:center;"></span>
        </a>

        <!-- Auth Buttons -->
        <div sec:authorize="isAnonymous()">
          <a th:href="@{/login}" class="px-4 py-2 text-label-md text-primary border border-primary rounded-lg hover:bg-primary/5">
            로그인
          </a>
          <a th:href="@{/register}" class="px-4 py-2 text-label-md text-on-primary bg-primary rounded-lg hover:opacity-90 shadow-md">
            회원가입
          </a>
        </div>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
          <button type="submit" class="btn btn-outline">
            로그아웃
          </button>
        </form>
      </div>
    </div>
  </div>

  <script th:inline="javascript" sec:authorize="isAuthenticated()">
    fetch('/api/notifications/unread-count')
      .then(res => res.json())
      .then(count => updateBadge(count))
      .catch(() => {});

    const eventSource = new EventSource('/api/notifications/sse');
    eventSource.addEventListener('notification', (e) => {
      const newCount = parseInt(e.data);
      updateBadge(newCount);
      if (newCount > 0) {
        playNotificationSound();
        pulseBadge();
      }
    });
    // onerror 시 close() 호출하지 않음 - 브라우저가 자동 재연결 처리

    function updateBadge(count) {
      const badge = document.getElementById('notification-badge');
      if (count > 0) {
        badge.textContent = count;
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    }

    function pulseBadge() {
      const badge = document.getElementById('notification-badge');
      badge.style.transition = 'transform 0.15s ease, box-shadow 0.15s ease';
      badge.style.transform = 'scale(1.6)';
      badge.style.boxShadow = '0 0 6px 2px rgba(239,68,68,0.7)';
      setTimeout(() => {
        badge.style.transform = 'scale(1)';
        badge.style.boxShadow = 'none';
      }, 300);
    }

    function playNotificationSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {}
    }
  </script>
</header>

<script th:inline="javascript">
  window.addEventListener("scroll", () => {
    const header = document.querySelector("header");
    if (window.scrollY > 20) {
      header.classList.add("shadow-md");
    } else {
      header.classList.remove("shadow-md");
    }
  });
</script>
</body>
</html>

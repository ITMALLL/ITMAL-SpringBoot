<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Header</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />


  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0058be",
            "surface-container-lowest": "#ffffff",
            "on-primary": "#ffffff",
            "on-surface": "#151c27",
            "on-surface-variant": "#424754",
            "outline-variant": "#c2c6d6",
            "primary-fixed": "#d8e2ff",
          },
          fontSize: {
            "label-md": ["14px", { lineHeight: "1.4", fontWeight: "500" }],
            "headline-lg": ["32px", { lineHeight: "1.3", fontWeight: "700" }],
          },
        },
      },
    };
  </script>

  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400; }
  </style>
</head>
<body>
<header th:fragment="header" class="bg-surface-container-lowest border-b border-outline-variant sticky top-0 z-50 shadow-sm">
  <div class="flex justify-between items-center h-16 px-6">

    <!-- Logo (왼쪽) -->
    <div class="text-headline-lg font-bold text-primary">잇말</div>

    <!-- Navigation + Actions (오른쪽) -->
    <div class="flex items-center gap-6">
      <!-- Navigation -->
      <nav class="hidden md:flex items-center gap-6">
        <a th:href="@{/}"
           th:class="${page == 'index'} ? 'text-primary font-bold border-b-2 border-primary pb-1' : 'text-on-surface-variant border-b-2 border-transparent pb-1 hover:text-primary'"
           class="text-label-md transition-colors">
          질문 목록
        </a>

        <a th:href="@{/chat}"
           th:class="${page == 'chat'} ? 'text-primary font-bold border-b-2 border-primary pb-1' : 'text-on-surface-variant border-b-2 border-transparent pb-1 hover:text-primary'"
           class="text-label-md transition-colors">
          채팅
        </a>

        <a th:href="@{/mypage}"
           th:class="${page == 'mypage'} ? 'text-primary font-bold border-b-2 border-primary pb-1' : 'text-on-surface-variant border-b-2 border-transparent pb-1 hover:text-primary'"
           class="text-label-md transition-colors">
          마이페이지
        </a>
      </nav>

      <!-- Divider -->
      <div class="h-6 w-px bg-outline-variant"></div>

      <!-- Notification + Auth -->
      <div class="flex items-center gap-4">
        <!-- Notification -->
        <button class="p-2 hover:bg-primary-fixed rounded-lg text-on-surface-variant">
          <span class="material-symbols-outlined">notifications</span>
        </button>

        <!-- Auth Buttons -->
        <a th:href="@{/login}" class="px-4 py-2 text-label-md text-primary border border-primary rounded-lg hover:bg-primary/5">
          로그인
        </a>
        <a th:href="@{/register}" class="px-4 py-2 text-label-md text-on-primary bg-primary rounded-lg hover:opacity-90 shadow-md">
          회원가입
        </a>
      </div>
    </div>
  </div>
</header>

<script th:inline="javascript">
  window.addEventListener("scroll", () => {
    const header = document.querySelector("header");
    if (window.scrollY > 20) {
      header.classList.add("shadow-md");
    } else {
      header.classList.remove("shadow-md");
    }
  });
</script>
</body>
</html>

<!doctype html>
<html class="light" lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ITMAL - 신고 관리 대시보드</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  </head>
  <body class="bg-background text-on-background">
    <div th:replace="~{fragments/header :: header}"></div>

    <main>
      <!-- Dashboard Header & Filters -->
      <section>
        <div class="admin-header">
          <h1 class="admin-title">신고 콘텐츠 관리</h1>
          <p class="admin-subtitle">
            커뮤니티 가이드라인을 위반한 콘텐츠를 검토하고 조치합니다.
          </p>
        </div>

        <!-- Controls -->
        <div class="admin-controls">
          <div class="control-group">
            <div class="control-tabs">
              <button class="tab-button active" data-type="QUESTION">질문</button>
              <button class="tab-button" data-type="ANSWER">답변</button>
              <button class="tab-button" data-type="COMMENT">댓글</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Report Content Grid -->
      <section class="mb-12">
        <div class="admin-content-layout">
          <div class="report-grid" id="report-grid">
            <!-- 카드는 admin.js가 /api/reports/pending/* 조회해서 채워넣음 -->
          </div>

          <!-- Stats Card -->
          <div class="stats-card">
            <span class="stats-icon">📊</span>
            <h3 class="stats-title">오늘의 신고 현황</h3>

            <div class="stats-values">
              <div class="stat-value">
                <p class="stat-label">미처리</p>
                <p class="stat-number" id="pending-count">-</p>
                <p class="stat-breakdown" id="pending-breakdown"></p>
              </div>
            </div>
          </div>
        </div>
        <p class="report-empty" id="report-empty" style="display: none;">
          처리할 신고가 없습니다.
        </p>
      </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="/js/admin.js"></script>
  </body>
</html>

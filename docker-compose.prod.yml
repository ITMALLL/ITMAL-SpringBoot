services:
  db:
    image: mysql:8.4
    container_name: mysql-itmal
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: itmal_db
      MYSQL_ROOT_PASSWORD: "root1234"
      MYSQL_USER: itmal
      MYSQL_PASSWORD: "itmal1234"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: cochaewon/itmal:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mysql://db:3306/itmal_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:

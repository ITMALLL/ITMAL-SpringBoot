version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: mysql-itmal-local

    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: itmal_db
      MYSQL_ROOT_PASSWORD: "root1234"
      MYSQL_USER: itmal
      MYSQL_PASSWORD: "itmal1234"

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: